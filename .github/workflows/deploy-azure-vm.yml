# Continuous delivery to the Azure VM.
#   push to main  -> CI -> build & push images to GHCR -> deploy (waits for approval
#                    when the "production" environment has required reviewers)
#   Run workflow  -> optional image_tag redeploys an earlier build (rollback) without rebuilding
#
# One-time setup (see docs/deployment-azure-vm.md):
#   secrets: VM_HOST, VM_USER, VM_SSH_PRIVATE_KEY, VM_SSH_KNOWN_HOSTS
#   variable: APP_URL (shown on the deployment)
name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit SHA) to redeploy. Leave empty to build the current commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push images
    needs: ci
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/in2erp" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: infrastructure/Dockerfile.backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VM
    needs: images
    # Runs after a successful build, or straight away for a rollback (build skipped).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check VM configuration
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$VM_HOST" ] || missing="$missing VM_HOST"
          [ -n "$VM_USER" ] || missing="$missing VM_USER"
          [ -n "$SSH_KEY" ] || missing="$missing VM_SSH_PRIVATE_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing VM_SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Azure VM is not configured yet. Missing secrets:$missing (see docs/deployment-azure-vm.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Image name prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/in2erp" >> "$GITHUB_ENV"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment files
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            infrastructure/vm/docker-compose.prod.yml infrastructure/vm/deploy.sh \
            "$VM:/opt/in2erp/"
      - name: Deploy
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The registry token travels on stdin (never on a command line) and expires with this job.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VM" \
            "IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' GHCR_USER='${{ github.actor }}' bash /opt/in2erp/deploy.sh"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
