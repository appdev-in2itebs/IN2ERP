# Quality gate: runs on every pull request and branch push, and before every deployment.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by the deploy workflow, which calls this one
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - name: Dependency vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t in2erp-backend:ci -f infrastructure/Dockerfile.backend backend
      - name: Migrations run inside the backend image
        run: docker run --rm -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db in2erp-backend:ci alembic upgrade head
      - name: Build frontend image
        run: docker build -f infrastructure/Dockerfile.frontend .
