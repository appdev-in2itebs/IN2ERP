# Host nginx site for In2ERP: /etc/nginx/sites-available/in2erp (symlinked into sites-enabled).
# Replace in2erp.example.com with the public hostname; obtain its certificate first, e.g.
#   sudo certbot certonly --webroot -w /var/www/html -d in2erp.example.com
# Port 80 (redirect + ACME challenge) is served by the VM's default site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name in2erp.example.com;

    ssl_certificate /etc/letsencrypt/live/in2erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/in2erp.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof the address the ERP records.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
