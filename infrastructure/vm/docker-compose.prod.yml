# In2ERP on an Azure VM. Copied to /opt/in2erp by the deploy workflow.
# Settings and secrets live in /opt/in2erp/.env on the VM (created by setup-vm.sh, never committed).
# IMAGE_PREFIX and IMAGE_TAG are supplied by deploy.sh.
#
#   internet -> host nginx (443, Let's Encrypt; infrastructure/vm/nginx-site.conf)
#            -> frontend (127.0.0.1:HTTP_PORT; SPA + /api proxy) -> backend -> postgres
# Only the frontend is published, and only on localhost, so the VM can host other sites alongside.
name: in2erp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erpuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: in2it_erp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpuser -d in2it_erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Schema migrations; run by deploy.sh before the new backend starts.
  migrate:
    image: ${IMAGE_PREFIX:?}-backend:${IMAGE_TAG:?}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  backend:
    image: ${IMAGE_PREFIX:?}-backend:${IMAGE_TAG:?}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:?}-frontend:${IMAGE_TAG:?}
    environment:
      API_UPSTREAM: http://backend:8000
      API_HOST: backend
    ports:
      - "127.0.0.1:${HTTP_PORT:-8091}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
